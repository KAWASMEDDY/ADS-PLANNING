<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planning ADS</title>
<meta name="theme-color" content="#59A8D9">
<meta name="description" content="Planning des interventions d'Assainissement Débouchage Services">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning ADS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Mise en page : en-tête compact, puis grille semaine (employeur) ou agenda par jour (salarié). Palette eau / canalisation. */
:root{
  color-scheme:light;
  --bg:#F1F5F9; --surface:#FFFFFF; --surface2:#E6EDF3; --fg:#17234C; --muted:#586A82; --line:#D6E0EA;
  --accent:#D32F2F; --accent-fg:#FFFFFF;
  --brand:#1A7DBD; --brand-fg:#FFFFFF; --brand-soft:#DCEBF7; --band:#59A8D9; --band-fg:#0B1F3D;
  --danger:#B3261E; --today:#E8F2FA; --warn:#8A5A00; --warn-bg:#FFF1CF;
  --t-debouchage:#1A7DBD; --t-curage:#7A4FB5; --t-camera:#B26F00; --t-fuite:#C2410C; --t-pompage:#2F7D4F; --t-entretien:#586A82; --t-devis:#B0326B;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;
  --bg:#0B1B2B; --surface:#12283C; --surface2:#193550; --fg:#E8F0F7; --muted:#9BB0C4; --line:#26425C;
  --accent:#D32F2F; --accent-fg:#FFFFFF;
  --brand:#59A8D9; --brand-fg:#0A2540; --brand-soft:#173A57; --band:#0A354E; --band-fg:#FFFFFF;
  --danger:#F2877F; --today:#14324B; --warn:#F0C766; --warn-bg:#3A2F12;
  --t-debouchage:#59A8D9; --t-curage:#B79BE6; --t-camera:#E8B04F; --t-fuite:#F09062; --t-pompage:#6FCB90; --t-entretien:#9BB0C4; --t-devis:#E58AB5}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-inline:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;background:var(--band);color:var(--band-fg);border-radius:14px;padding:10px 14px}
.brand{display:flex;flex-direction:row;align-items:center;gap:12px;min-width:0}
.logo{height:40px;width:auto;display:block;background:#fff;border-radius:10px;padding:5px 10px}
.brand span{font-family:var(--f-display);font-weight:600;font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabs{display:flex;background:var(--surface2);border-radius:8px;padding:3px;gap:2px}
.top .tabs{background:rgba(255,255,255,.4)}
.top .tab{color:var(--band-fg)}
.top .tab[aria-selected="true"]{color:var(--fg)}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:6px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.spacer{flex:1}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .label{font-family:var(--f-display);font-weight:600;font-size:16px;min-width:0;padding-inline:6px;text-align:center}
.weeknav .label small{display:block;font-family:var(--f-body);font-weight:400;opacity:.85;font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{border-color:var(--accent);filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.icon{padding:7px 10px;min-width:36px}
.btn.small{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.6;cursor:default}
.userbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px}

.notice{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px}
.summary{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:13px;align-items:center}
.summary b{color:var(--fg);font-weight:600}

/* Connexion */
.login{max-width:380px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--f-display);font-size:28px;margin:0;line-height:1.1}
.login p{margin:0;color:var(--muted)}
.login .logo{height:46px;align-self:flex-start;padding:0;background:none}
.err{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}

/* Grille employeur */
.gridbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.grid{display:grid;grid-template-columns:132px repeat(7,minmax(158px,1fr));min-width:1240px}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-width:0}
.grid > .cell:nth-child(8n){border-right:0}
.hd{background:var(--surface2);padding:8px 8px;display:flex;flex-direction:column}
.hd .dn{font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--muted)}
.hd .dd{font-family:var(--f-display);font-weight:600;font-size:17px}
.hd.today{background:var(--brand);color:var(--brand-fg)}
.hd.today .dn{color:inherit;opacity:.85}
.who{position:sticky;left:0;background:var(--surface);z-index:1;display:flex;flex-direction:column;gap:2px;padding:10px 10px}
.who b{font-family:var(--f-display);font-size:15px;font-weight:600}
.who span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.who.un b{color:var(--warn)}
.day{display:flex;flex-direction:column;gap:5px;min-height:74px}
.day.today{background:var(--today)}
.add{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:2px;font-size:13px;opacity:0;transition:opacity .12s;margin-top:auto}
.day:hover .add,.add:focus-visible{opacity:1}
@media (hover:none){.add{opacity:1}}

.mboss{display:none}
.mday{display:flex;flex-direction:column;gap:6px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface2);border-radius:8px;padding:6px 8px 6px 12px}
.mh .dn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mh .dd{font-family:var(--f-display);font-weight:600;font-size:17px}
.mday.today .mh{background:var(--brand);color:var(--brand-fg)}
.mh .btn{color:var(--fg)}
.mday.today .mh .dn{color:inherit;opacity:.85}
.wrap>*{min-width:0}
.iv{display:flex;flex-direction:column;gap:2px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.iv:hover{border-color:var(--brand)}
.iv .t{font-family:var(--f-mono);font-size:12px;font-weight:500}
.iv .c{font-weight:600;overflow-wrap:anywhere}
.iv .a{font-size:12px;color:var(--muted);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tc,var(--muted));display:inline-block;flex:none}
.iv.annulee{opacity:.55}
.iv.annulee .c{text-decoration:line-through}
.badge{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--surface2);color:var(--muted);align-self:flex-start}
.badge.terminee{background:var(--brand-soft);color:var(--brand)}
.badge.encours{background:var(--warn-bg);color:var(--warn)}

/* Vue salarié */
.me{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.me label{color:var(--muted)}
.me select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:150px}
.agenda{display:flex;flex-direction:column;gap:12px}
.dayblock{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px}
.dayblock .dl{padding-top:4px}
.dayblock .dl .dn{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dayblock .dl .dd{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05}
.dayblock.today .dl .dd{color:var(--brand)}
.dayblock .list{display:flex;flex-direction:column;gap:8px;min-width:0}
.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dayblock.today .job{border-color:var(--brand)}
.job .row1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.job .time{font-family:var(--f-mono);font-weight:500;font-size:15px}
.job .client{font-family:var(--f-display);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.job .addr{overflow-wrap:anywhere}
.job .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13px;align-items:center}
.job .note{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.job a{color:var(--brand);font-weight:500}
.free{color:var(--muted);padding:8px 2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);text-align:center}

/* Fenêtres */
.overlay{position:fixed;inset:0;background:rgba(6,20,25,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:560px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-block:auto}
.modal h2{font-family:var(--f-display);font-size:20px;margin:0}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions .sp{flex:1}
.warnline{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:7px 10px;font-size:13px}
.team-list{display:flex;flex-direction:column;gap:8px}
.team-item{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.team-item .fld{flex:1;min-width:150px}
.small-note{color:var(--muted);font-size:13px;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:60;max-width:calc(100% - 32px)}
[hidden]{display:none!important}

@media (max-width:760px){
  .gridbox{display:none}
  .mboss{display:flex;flex-direction:column;gap:14px}
  .summary .btn{padding:8px 12px;font-size:13px}
}
@media (max-width:640px){
  input,select,textarea{font-size:16px}
  .brand span{display:none}
  .fields{grid-template-columns:1fr}
  .dayblock{grid-template-columns:56px minmax(0,1fr);gap:10px}
  .dayblock .dl .dd{font-size:22px}
  .weeknav{width:100%;justify-content:space-between}
  .weeknav .label{flex:1}
}
@media (pointer:coarse){input,select,textarea,.fld input,.fld select,.fld textarea,.me select{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
  'use strict';
  var TYPES={debouchage:'Débouchage',curage:'Hydrocurage',camera:'Inspection caméra',fuite:'Recherche de fuite',pompage:'Vidange / pompage',entretien:'Entretien',devis:'Visite / devis'};
  var STATUS={prevue:'Prévue',encours:'En cours',terminee:'Terminée',annulee:'Annulée'};
  var DAYS=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
  var MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

  var cfg=window.ADS_CONFIG||{};
  var configured=cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&cfg.TEAM_EMAIL&&!/VOTRE/.test(cfg.SUPABASE_URL+cfg.SUPABASE_ANON_KEY);
  var sb=null;
  var session=null,profile=null,profiles=[],team=[],items=[];
  var role='salarie',me='',weekStart=mondayOf(new Date()),editing=null,deferredInstall=null,loadSeq=0,refreshTimer=null;

  function $(id){return document.getElementById(id)}
  function focusEl(el){if(el&&!(window.matchMedia&&matchMedia('(pointer:coarse)').matches))el.focus()}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
  function pad(n){return n<10?'0'+n:''+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
  function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
  function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
  function t5(s){return String(s||'').slice(0,5)}
  function toMin(t){var p=t5(t).split(':');return (+p[0]||0)*60+(+p[1]||0)}
  function hours(it){var m=toMin(it.end)-toMin(it.start);return m>0?m/60:0}
  function fmtH(h){return (''+(Math.round(h*10)/10)).replace('.',',')+' h'}
  function todayIso(){return iso(new Date())}
  function weekRange(){var a=weekStart,b=addDays(a,6);return a.getDate()+(a.getMonth()!==b.getMonth()?' '+MONTHS[a.getMonth()]:'')+' – '+b.getDate()+' '+MONTHS[b.getMonth()]+' '+b.getFullYear()}
  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._h);toast._h=setTimeout(function(){t.hidden=true},4200)}
  function byTime(a,b){return (a.start||'').localeCompare(b.start||'')}
  function typeColor(t){return 'var(--t-'+(TYPES[t]?t:'entretien')+')'}
  function mapsUrl(a){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a)}
  function nameOf(id){var p=team.filter(function(x){return x.id===id})[0];return p?p.name:'Salarié'}
  function isBoss(){return profile&&profile.role==='employeur'}
  function isStandalone(){return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true}

  /* ---------- Écrans ---------- */
  function renderSetup(){
    $('app').innerHTML='<div class="login"><h1>Planning ADS</h1><div class="err">La connexion à la base de données n’est pas encore réglée. Ouvrez le fichier config.js et renseignez l’adresse et la clé Supabase, comme indiqué dans le guide.</div></div>';
  }
  var loginMode='equipe';
  function renderLogin(msg){
    var eq=loginMode==='equipe';
    $('app').innerHTML='<form class="login" id="'+(eq?'loginteam':'loginboss')+'" autocomplete="on">'+
      '<img class="logo" src="logo.png" alt="ADS Assainissement Débouchage Services">'+
      '<div><h1>Planning des interventions</h1><p>Assainissement Débouchage Services</p></div>'+
      '<div class="tabs" role="tablist"><button type="button" class="tab" role="tab" data-a="logintab" data-v="equipe" aria-selected="'+eq+'">Salarié</button><button type="button" class="tab" role="tab" data-a="logintab" data-v="boss" aria-selected="'+(!eq)+'">Employeur</button></div>'+
      (msg?'<div class="err" role="alert">'+esc(msg)+'</div>':'')+
      (eq?
        '<div class="fld"><label for="code">Code de l’équipe</label><input id="code" type="password" autocomplete="current-password" required></div>'+
        '<button class="btn primary" type="submit" id="loginbtn">Entrer</button>'+
        '<p class="small-note">Le code vous est donné par votre employeur. Vous choisirez ensuite votre prénom dans la liste.</p>'
      :
        '<div class="fld"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="username" required></div>'+
        '<div class="fld"><label for="pwd">Mot de passe</label><input id="pwd" type="password" autocomplete="current-password" required></div>'+
        '<button class="btn primary" type="submit" id="loginbtn">Se connecter</button>')+
      '</form>';
    focusEl($(eq?'code':'email'));
  }
  function renderTop(){
    var tabs='';
    if(isBoss()){tabs='<div class="tabs" role="tablist"><button class="tab" role="tab" data-a="role" data-v="employeur" aria-selected="'+(role==='employeur')+'">Employeur</button><button class="tab" role="tab" data-a="role" data-v="salarie" aria-selected="'+(role==='salarie')+'">Vue salarié</button></div>'}
    var inst=isStandalone()?'':'<button class="btn small" data-a="install">Installer l’application</button>';
    $('app').innerHTML=
      '<div class="top"><div class="brand"><h1 class="sr">Planning ADS</h1><img class="logo" src="logo.png" alt="ADS Assainissement Débouchage Services"><span>Planning des interventions</span></div>'+tabs+'<div class="spacer"></div>'+
      '<div class="weeknav"><button class="btn icon" data-a="prev" aria-label="Semaine précédente">‹</button>'+
      '<div class="label">Semaine '+isoWeek(weekStart)+'<small>'+esc(weekRange())+'</small></div>'+
      '<button class="btn icon" data-a="next" aria-label="Semaine suivante">›</button><button class="btn" data-a="today">Aujourd’hui</button></div></div>'+
      '<div class="userbar"><span>Connecté : <b style="color:var(--fg)">'+esc(isBoss()?'Employeur':(me?nameOf(me):'Équipe'))+'</b></span>'+inst+'<button class="btn small" data-a="logout">Se déconnecter</button></div>'+
      '<div id="main"></div>';
    renderMain();
  }
  function renderMain(){
    if(!$('main'))return;
    if(isBoss()&&role==='employeur')renderBoss();else renderEmployee();
  }
  function legend(){return '<div class="summary">'+Object.keys(TYPES).map(function(k){return '<span class="chip" style="--tc:'+typeColor(k)+'"><i></i>'+TYPES[k]+'</span>'}).join('')+'</div>'}
  function cardHtml(it,withWho){
    var badge=it.status&&it.status!=='prevue'?'<span class="badge '+esc(it.status)+'">'+esc(STATUS[it.status]||'')+'</span>':'';
    return '<button class="iv '+esc(it.status||'')+'" data-a="edit" data-id="'+esc(it.id)+'">'+
      '<span class="t">'+esc(it.start)+' – '+esc(it.end)+'</span>'+
      '<span class="chip" style="--tc:'+typeColor(it.type)+'"><i></i>'+esc(TYPES[it.type]||'Intervention')+'</span>'+
      '<span class="c">'+esc(it.client||'Client à préciser')+'</span>'+
      (it.address?'<span class="a">'+esc(it.address)+'</span>':'')+
      (withWho?'<span class="badge">'+(it.emp?esc(nameOf(it.emp)):'À affecter')+'</span>':'')+badge+'</button>';
  }
  function renderBoss(){
    var td=todayIso(),active=items.filter(function(i){return i.status!=='annulee'});
    var unassigned=active.filter(function(i){return !i.emp}).length;
    var h='<div class="summary"><span><b>'+active.length+'</b> intervention'+(active.length>1?'s':'')+' cette semaine</span>'+
      (unassigned?'<span style="color:var(--warn)"><b>'+unassigned+'</b> à affecter</span>':'')+
      '<span class="spacer"></span><button class="btn small" data-a="team">Équipe</button><button class="btn small primary" data-a="new">+ Intervention</button></div>';
    h+='<div class="gridbox"><div class="grid"><div class="cell hd"><span class="dn">Équipe</span></div>';
    for(var i=0;i<7;i++){var d=addDays(weekStart,i);h+='<div class="cell hd'+(iso(d)===td?' today':'')+'"><span class="dn">'+DAYS[i]+'</span><span class="dd">'+d.getDate()+' '+MONTHS[d.getMonth()].slice(0,4)+(MONTHS[d.getMonth()].length>4?'.':'')+'</span></div>'}
    var rows=team.map(function(p){return p.id}).concat(['']);
    rows.forEach(function(id){
      var mine=items.filter(function(it){return (it.emp||'')===id});
      if(id===''&&!mine.length)return;
      var live=mine.filter(function(x){return x.status!=='annulee'});
      var tot=live.reduce(function(s,x){return s+hours(x)},0);
      h+='<div class="cell who'+(id===''?' un':'')+'"><b>'+(id===''?'À affecter':esc(nameOf(id)))+'</b><span>'+fmtH(tot)+' · '+live.length+' interv.</span></div>';
      for(var k=0;k<7;k++){
        var ds=iso(addDays(weekStart,k));
        var list=mine.filter(function(it){return it.date===ds}).sort(byTime);
        h+='<div class="cell day'+(ds===td?' today':'')+'">'+list.map(cardHtml).join('')+
          '<button class="add" data-a="new" data-emp="'+esc(id)+'" data-date="'+ds+'" aria-label="Ajouter une intervention le '+ds+'">+</button></div>';
      }
    });
    h+='</div></div>';
    h+='<div class="mboss">';
    for(var j=0;j<7;j++){
      var dj=addDays(weekStart,j),dsj=iso(dj);
      var lj=items.filter(function(it){return it.date===dsj}).sort(byTime);
      h+='<section class="mday'+(dsj===td?' today':'')+'"><div class="mh"><div><span class="dn">'+DAYS[j]+'</span> <span class="dd">'+dj.getDate()+' '+MONTHS[dj.getMonth()]+'</span></div><button class="btn small" data-a="new" data-date="'+dsj+'">+ Ajouter</button></div>'+
        (lj.length?lj.map(function(it){return cardHtml(it,true)}).join(''):'<div class="free">Rien de prévu</div>')+'</section>';
    }
    h+='</div>';
    if(!team.length)h+='<div class="empty">Aucun salarié pour l’instant. Ajoutez-les avec le bouton « Équipe ».</div>';
    else if(!items.length)h+='<div class="empty">Aucune intervention cette semaine. Utilisez « + Intervention » ou le + dans une case pour en planifier une.</div>';
    $('main').innerHTML=h+legend();
  }
  function renderEmployee(){
    var saved='';try{saved=localStorage.getItem('ads-me')||''}catch(x){}
    if(me&&!team.some(function(p){return p.id===me}))me='';
    if(!isBoss()&&!me&&saved&&team.some(function(p){return p.id===saved}))me=saved;
    if(isBoss()&&!me)me=team.length?team[0].id:'';
    var h='<div class="me"><label for="me">'+(isBoss()?'Voir le planning de':'Vous êtes')+'</label><select id="me" data-a="me">'+
      (isBoss()?'':'<option value="">Choisir mon prénom</option>')+
      team.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===me?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></div>';
    if(!me){$('main').innerHTML=h+'<div class="empty">'+(team.length?'Choisissez votre prénom pour voir vos interventions de la semaine.':'Aucun salarié dans la liste pour l’instant.')+'</div>';return}
    var mine=items.filter(function(it){return it.emp===me&&it.status!=='annulee'});
    var tot=mine.reduce(function(s,x){return s+hours(x)},0);
    h+='<div class="summary"><span><b>'+mine.length+'</b> intervention'+(mine.length>1?'s':'')+'</span><span><b>'+fmtH(tot)+'</b> planifiées</span></div><div class="agenda">';
    var td=todayIso();
    for(var i=0;i<7;i++){
      var d=addDays(weekStart,i),ds=iso(d);
      var list=items.filter(function(it){return it.emp===me&&it.date===ds}).sort(byTime);
      if(!list.length&&i>=5)continue;
      h+='<div class="dayblock'+(ds===td?' today':'')+'"><div class="dl"><div class="dn">'+DAYS[i].slice(0,3)+'.</div><div class="dd">'+d.getDate()+'</div></div><div class="list">';
      if(!list.length)h+='<div class="free">Rien de prévu</div>';
      list.forEach(function(it){
        h+='<div class="job"><div class="row1"><span class="time">'+esc(it.start)+' – '+esc(it.end)+'</span>'+
          '<span class="chip" style="--tc:'+typeColor(it.type)+'"><i></i>'+esc(TYPES[it.type]||'Intervention')+'</span>'+
          (it.status&&it.status!=='prevue'?'<span class="badge '+esc(it.status)+'">'+esc(STATUS[it.status])+'</span>':'')+'</div>'+
          '<div class="client">'+esc(it.client||'Client à préciser')+'</div>'+
          (it.address?'<div class="addr">'+esc(it.address)+'</div>':'')+
          '<div class="meta">'+(it.address?'<a href="'+mapsUrl(it.address)+'" target="_blank" rel="noopener">Ouvrir dans Maps</a>':'')+
          (it.phone?'<span>Client : <a href="tel:'+esc(it.phone.replace(/[^0-9+]/g,''))+'">'+esc(it.phone)+'</a></span>':'')+'</div>'+
          (it.note?'<div class="note">'+esc(it.note)+'</div>':'')+'</div>';
      });
      h+='</div></div>';
    }
    $('main').innerHTML=h+'</div>';
  }

  /* ---------- Fenêtre intervention (employeur) ---------- */
  function fld(id,label,inner,cls){return '<div class="fld '+(cls||'')+'"><label for="'+id+'">'+label+'</label>'+inner+'</div>'}
  function openForm(id,preset){
    var it=id?items.filter(function(x){return x.id===id})[0]:null;
    var d=it?Object.assign({},it):Object.assign({date:iso(weekStart),start:'08:00',end:'10:00',emp:'',type:'debouchage',status:'prevue',client:'',phone:'',address:'',note:''},preset||{});
    editing={id:it?it.id:null};
    var empOpts='<option value="">À affecter</option>'+team.map(function(p){return '<option value="'+esc(p.id)+'"'+(p.id===d.emp?' selected':'')+'>'+esc(p.name)+'</option>'}).join('');
    var typeOpts=Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(k===d.type?' selected':'')+'>'+TYPES[k]+'</option>'}).join('');
    var stOpts=Object.keys(STATUS).map(function(k){return '<option value="'+k+'"'+(k===d.status?' selected':'')+'>'+STATUS[k]+'</option>'}).join('');
    $('modal').innerHTML='<div class="overlay" data-a="overlay"><form class="modal" id="form" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">'+(it?'Modifier l’intervention':'Nouvelle intervention')+'</h2><div class="fields">'+
      fld('f-client','Client','<input id="f-client" value="'+esc(d.client)+'" autocomplete="off">','full')+
      fld('f-address','Lieu de l’intervention','<input id="f-address" value="'+esc(d.address)+'" placeholder="Numéro, rue, commune" autocomplete="off">','full')+
      fld('f-date','Date','<input id="f-date" type="date" value="'+esc(d.date)+'" required>')+
      fld('f-emp','Salarié','<select id="f-emp">'+empOpts+'</select>')+
      fld('f-start','Début','<input id="f-start" type="time" value="'+esc(d.start)+'" required>')+
      fld('f-end','Fin','<input id="f-end" type="time" value="'+esc(d.end)+'" required>')+
      fld('f-type','Type d’intervention','<select id="f-type">'+typeOpts+'</select>')+
      fld('f-status','Statut','<select id="f-status">'+stOpts+'</select>')+
      fld('f-phone','Téléphone du client','<input id="f-phone" value="'+esc(d.phone)+'" inputmode="tel" autocomplete="off">','full')+
      fld('f-note','Consignes pour le salarié','<textarea id="f-note">'+esc(d.note)+'</textarea>','full')+
      '</div><div id="conf"></div><div class="actions"><button type="submit" class="btn primary" id="savebtn">Enregistrer</button><button type="button" class="btn" data-a="close">Annuler</button><span class="sp"></span>'+
      (it?'<button type="button" class="btn" data-a="dup">Dupliquer</button><button type="button" class="btn danger" data-a="del">Supprimer</button>':'')+'</div></form></div>';
    checkConflict();
    focusEl($('f-client'));
  }
  function readForm(){
    return {date:$('f-date').value,start:$('f-start').value,end:$('f-end').value,emp:$('f-emp').value,type:$('f-type').value,status:$('f-status').value,
      client:$('f-client').value.trim(),phone:$('f-phone').value.trim(),address:$('f-address').value.trim(),note:$('f-note').value.trim()};
  }
  function checkConflict(){
    var box=$('conf');if(!box||!$('f-date'))return;
    var v=readForm(),msg='';
    if(v.start&&v.end&&toMin(v.end)<=toMin(v.start))msg='L’heure de fin doit être après l’heure de début.';
    else if(v.emp&&v.status!=='annulee'){
      var c=items.filter(function(x){return x.id!==(editing&&editing.id)&&x.emp===v.emp&&x.date===v.date&&x.status!=='annulee'&&toMin(x.start)<toMin(v.end)&&toMin(x.end)>toMin(v.start)})[0];
      if(c)msg=nameOf(v.emp)+' a déjà une intervention de '+c.start+' à '+c.end+(c.client?' chez '+c.client:'')+'.';
    }
    box.innerHTML=msg?'<div class="warnline">'+esc(msg)+'</div>':'';
  }
  function closeModal(){$('modal').innerHTML='';editing=null}

  /* ---------- Équipe ---------- */
  function openTeam(){
    $('modal').innerHTML='<div class="overlay" data-a="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="tt"><h2 id="tt">Équipe</h2>'+
      '<div class="team-list">'+(team.length?team.map(function(p){return '<div class="team-item"><div class="fld"><label for="n-'+esc(p.id)+'">Prénom</label><input id="n-'+esc(p.id)+'" value="'+esc(p.name)+'" autocomplete="off"></div><button class="btn small primary" data-a="renameemp" data-id="'+esc(p.id)+'">Enregistrer</button><button class="btn small danger" data-a="delemp" data-id="'+esc(p.id)+'">Retirer</button></div>'}).join(''):'<p class="small-note">Aucun salarié pour l’instant.</p>')+'</div>'+
      '<form id="addempform" class="team-item"><div class="fld"><label for="newemp">Ajouter un salarié</label><input id="newemp" autocomplete="off" placeholder="Prénom"></div><button class="btn small primary" type="submit">Ajouter</button></form>'+
      '<p class="small-note">Ces prénoms forment la liste que les salariés voient à l’ouverture. Retirer un salarié ne supprime pas ses interventions : elles repassent en « À affecter ».</p>'+
      '<div class="actions"><span class="sp"></span><button class="btn primary" data-a="close">Fermer</button></div></div></div>';
  }

  /* ---------- Installation sur l'écran d'accueil ---------- */
  function openInstall(){
    var ua=navigator.userAgent||'';
    var ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    var android=/Android/i.test(ua),steps;
    if(ios)steps=['Ouvrez cette page dans <b>Safari</b>.','Touchez le bouton <b>Partager</b> (carré avec une flèche vers le haut).','Choisissez <b>Sur l’écran d’accueil</b>, puis <b>Ajouter</b>.'];
    else if(android)steps=['Ouvrez cette page dans <b>Chrome</b>.','Touchez le menu <b>⋮</b> en haut à droite.','Choisissez <b>Installer l’application</b> ou <b>Ajouter à l’écran d’accueil</b>.'];
    else steps=['<b>iPhone</b> : ouvrez la page dans Safari, touchez Partager, puis « Sur l’écran d’accueil ».','<b>Android</b> : ouvrez la page dans Chrome, touchez le menu ⋮, puis « Installer l’application ».','<b>Ordinateur</b> : dans Chrome ou Edge, cliquez sur l’icône d’installation à droite de la barre d’adresse.'];
    $('modal').innerHTML='<div class="overlay" data-a="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="it"><h2 id="it">Installer l’application</h2><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px">'+steps.map(function(s){return '<li>'+s+'</li>'}).join('')+'</ol><div class="actions"><span class="sp"></span><button class="btn primary" data-a="close">Compris</button></div></div></div>';
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e});
  window.addEventListener('appinstalled',function(){deferredInstall=null;if(session)renderTop()});

  /* ---------- Données ---------- */
  function fromRow(r){return {id:r.id,date:r.date,start:t5(r.start_time),end:t5(r.end_time),emp:r.employee_id||'',type:r.type,status:r.status,client:r.client||'',phone:r.phone||'',address:r.address||'',note:r.note||''}}
  function toRow(v){return {date:v.date,start_time:v.start,end_time:v.end,employee_id:v.emp||null,type:v.type,status:v.status,client:v.client,phone:v.phone,address:v.address,note:v.note}}
  async function loadTeam(){
    var r=await sb.from('employees').select('id,name').order('name');
    if(r.error){toast('Lecture de l’équipe impossible.');return}
    team=r.data||[];
  }
  async function loadWeek(){
    var seq=++loadSeq,a=iso(weekStart),b=iso(addDays(weekStart,6));
    var r=await sb.from('interventions').select('*').gte('date',a).lte('date',b).order('date').order('start_time');
    if(seq!==loadSeq)return;
    if(r.error){toast('Lecture du planning impossible. Vérifiez votre connexion.');return}
    items=(r.data||[]).map(fromRow);
    if($('modal').innerHTML===''||!$('form'))renderMain();
  }
  function goWeek(d){weekStart=d;renderTop();loadWeek()}
  async function afterLogin(){
    var r=await sb.from('profiles').select('id,name,role').eq('id',session.user.id).maybeSingle();
    if(r.error||!r.data){renderLogin('Votre compte n’est pas encore activé. Contactez votre employeur.');await sb.auth.signOut();return}
    profile=r.data;
    role=isBoss()?'employeur':'salarie';
    await loadTeam();
    renderTop();
    await loadWeek();
    clearInterval(refreshTimer);
    refreshTimer=setInterval(function(){if(document.visibilityState==='visible'&&!$('form')&&session)loadWeek()},60000);
  }
  async function saveItem(id,v){
    var row=toRow(v),r=id?await sb.from('interventions').update(row).eq('id',id):await sb.from('interventions').insert(row);
    return r.error;
  }

  /* ---------- Événements ---------- */
  document.addEventListener('click',async function(e){
    var el=e.target.closest('[data-a]');if(!el)return;
    var a=el.getAttribute('data-a');
    if(a==='overlay'){if(e.target===el)closeModal();return}
    if(a==='prev')goWeek(addDays(weekStart,-7));
    else if(a==='next')goWeek(addDays(weekStart,7));
    else if(a==='today')goWeek(mondayOf(new Date()));
    else if(a==='logintab'){loginMode=el.getAttribute('data-v');renderLogin()}
    else if(a==='role'){role=el.getAttribute('data-v');renderTop()}
    else if(a==='new'){var p={};if(el.getAttribute('data-date'))p.date=el.getAttribute('data-date');if(el.hasAttribute('data-emp'))p.emp=el.getAttribute('data-emp');openForm(null,p)}
    else if(a==='edit'&&isBoss())openForm(el.getAttribute('data-id'));
    else if(a==='close')closeModal();
    else if(a==='team')openTeam();
    else if(a==='renameemp'){
      var id=el.getAttribute('data-id'),name=$('n-'+id).value.trim();
      if(!name){toast('Le prénom ne peut pas être vide.');return}
      var r=await sb.from('employees').update({name:name}).eq('id',id);
      if(r.error){toast('Modification refusée.');return}
      await loadTeam();renderMain();toast('Prénom enregistré.');
    }
    else if(a==='delemp'){
      if(el.getAttribute('data-c')!=='1'){el.setAttribute('data-c','1');el.textContent='Confirmer';return}
      var rd=await sb.from('employees').delete().eq('id',el.getAttribute('data-id'));
      if(rd.error){toast('Suppression refusée.');return}
      await loadTeam();openTeam();loadWeek();
    }
    else if(a==='install'){
      if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(x){}deferredInstall=null}else openInstall();
    }
    else if(a==='logout'){await sb.auth.signOut()}
    else if(a==='dup'&&editing){editing.id=null;$('mt').textContent='Nouvelle intervention (copie)';el.parentNode.querySelectorAll('[data-a="del"],[data-a="dup"]').forEach(function(x){x.remove()});focusEl($('f-date'))}
    else if(a==='del'&&editing){
      if(el.getAttribute('data-c')!=='1'){el.setAttribute('data-c','1');el.textContent='Confirmer la suppression';return}
      var r2=await sb.from('interventions').delete().eq('id',editing.id);
      if(r2.error){toast('Suppression refusée.');return}
      closeModal();loadWeek();
    }
  });
  document.addEventListener('change',function(e){
    if(e.target.id==='me'){me=e.target.value;if(!isBoss()){try{localStorage.setItem('ads-me',me)}catch(x){}}renderTop()}
    if(e.target.closest&&e.target.closest('#form'))checkConflict();
  });
  document.addEventListener('input',function(e){if(e.target.closest&&e.target.closest('#form'))checkConflict()});
  document.addEventListener('submit',async function(e){
    e.preventDefault();
    if(e.target.id==='loginteam'||e.target.id==='loginboss'){
      var isTeam=e.target.id==='loginteam';
      var btn=$('loginbtn');btn.disabled=true;btn.textContent='Connexion…';
      var cred=isTeam?{email:cfg.TEAM_EMAIL,password:$('code').value}:{email:$('email').value.trim(),password:$('pwd').value};
      var r=await sb.auth.signInWithPassword(cred);
      if(r.error){renderLogin(isTeam?'Code incorrect.':'Adresse e-mail ou mot de passe incorrect.')}
      return;
    }
    if(e.target.id==='addempform'){
      var nm=$('newemp').value.trim();if(!nm)return;
      if(team.some(function(p){return p.name.toLowerCase()===nm.toLowerCase()})){toast('Ce prénom existe déjà.');return}
      var ri=await sb.from('employees').insert({name:nm});
      if(ri.error){toast('Ajout refusé.');return}
      await loadTeam();openTeam();renderMain();return;
    }
    if(e.target.id==='form'){
      var v=readForm();
      if(!v.date||!v.start||!v.end){toast('Renseignez la date et les heures.');return}
      if(toMin(v.end)<=toMin(v.start)){toast('L’heure de fin doit être après le début.');return}
      var sbtn=$('savebtn');sbtn.disabled=true;
      var err=await saveItem(editing&&editing.id,v);
      if(err){sbtn.disabled=false;toast('Enregistrement refusé ou connexion perdue.');return}
      closeModal();
      if(v.date<iso(weekStart)||v.date>iso(addDays(weekStart,6)))weekStart=mondayOf(new Date(v.date+'T12:00:00'));
      renderTop();loadWeek();
    }
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('modal').innerHTML)closeModal()});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&session&&!$('form'))loadWeek()});

  /* ---------- Démarrage ---------- */
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
  if(!configured||!window.supabase){renderSetup();return}
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange(function(event,s){
    if(event==='SIGNED_OUT'||!s){session=null;profile=null;items=[];clearInterval(refreshTimer);closeModal();renderLogin();return}
    if(event==='SIGNED_IN'||event==='INITIAL_SESSION'){
      var first=!session||session.user.id!==s.user.id;
      session=s;
      if(first)setTimeout(afterLogin,0);
    }else session=s;
  });
  sb.auth.getSession().then(function(r){if(!r.data.session)renderLogin()});
})();
</script>
</body>
</html>
